<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会话页骨架 · 开发预览（假数据）</title>
<!--
  ★ 这是**开发预览壳**，不是产品页面 ✓。
  用途：改 `ui.js` 的观感/结构时，**先让自己看得见** —— 本项目吃过四次
  "盲改 CSS ⇒ 连引回归"的亏（见 `10-交接文档` 的教训 ✓）。
  产品里这一页由宿主发出来（与 `codex-page.ts` 同一类 ✓），数据来自 `mobile/dsh/*` ✓。

  跑法（不依赖任何服务）：
    node docs/native/shot-mock.mjs 那一套 Chrome 命令行，指向 file://…/dev.html 即可 ✓
-->
<style>
  /* 开发壳专有：把内部读数画在屏幕上（产品页没有这行 ✓） */
  .dev-line { padding: 0 20px 6px; font-size: 10.5px; color: var(--ink3); }
</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<div class="app">
  <div class="status">9:41</div>
  <header>
    <div>
      <button id="title" class="title" type="button">换图标那两个标签</button>
      <p class="sub">Mac mini 2024 · 端口 3453 · 局域网</p>
    </div>
    <span class="grow"></span>
    <button id="refresh" title="刷新">⟳</button>
  </header>
  <!--
    ★★ 「对话｜轨迹」标签栏 —— 与产品页（`page.html`）**逐字同构** ✓。
      `theme.css` 顶部那条规矩：**稿子与装机必须同源** ✗（"稿子好看、装机变样"就是这么来的 ✓）。
      ★ 结构与属性一个不改 ✓（`role` / `aria-selected` / `data-conversation-tabs` ✓）；
      ★ 两个视图层同理 ✓（`#messages` 对话 ✓、`#trace` 轨迹 ✓）。
      没有子智能体数徽标：数据到不了这一页（见 `page.html` 里那段说明 ✓）。
  -->
  <div class="tabs" id="tabs" role="tablist" data-conversation-tabs>
    <button type="button" role="tab" id="tab-chat" class="tab is-active" aria-selected="true" aria-controls="view-chat">对话</button>
    <button type="button" role="tab" id="tab-trace" class="tab" aria-selected="false" aria-controls="view-trace">轨迹</button>
  </div>
  <div id="status">已连上，正在读…</div>
  <div id="sessions" hidden></div>
  <main>
    <div id="state" hidden></div>
    <div id="messages" data-view="chat"></div>
    <div id="trace" data-view="trace" hidden></div>
  </main>
  <!--
    ★ 输入栏与产品页（`page.html`）**同一份结构** ✓ —— `theme.css` 顶部那条规矩：
      "稿子与装机必须同源"✗（"稿子好看、装机变样"就是这么来的 ✓）。
      ★ 只改长相、不动接线 ✓：仍然是 `#composer` 的 submit + 它里面那颗 `button[type=submit]`
        （`ui.js` 里 `form.querySelector('button')` 取到的还是它 ✓）。
  -->
  <form class="composer" id="composer">
    <div class="composer-card">
      <textarea id="input" rows="1" placeholder="发消息或创建任务，/ 调用指令，@ 文件或对话"></textarea>
      <div class="composer-row">
        <div class="composer-tools">
          <button type="button" class="tool-btn" data-tool="command" aria-label="命令行" title="命令行">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M3.2 4.6 L6.6 8 L3.2 11.4" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M8.4 11.6 H12.8" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round"></path>
            </svg>
          </button>
          <button type="button" class="tool-btn" data-tool="attach" aria-label="添加附件" title="添加附件">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M10.6 4.1 5.6 9.1a2.05 2.05 0 0 0 2.9 2.9l5.2-5.2a3.4 3.4 0 0 0-4.8-4.8L3.6 7.3a4.75 4.75 0 0 0 6.7 6.7l4.1-4.1"
                    fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"
                    stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <span class="composer-grow"></span>
        <button type="submit" class="send-btn" aria-label="发送" title="发送">
          <svg class="send-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M10 16.6 V4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
            <path d="M4.8 9.2 10 4 L15.2 9.2" fill="none" stroke="currentColor" stroke-width="1.9"
                  stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="send-label" id="send-label"></span>
        </button>
      </div>
    </div>
    <div class="stats-strip" id="stats-strip" aria-live="polite"></div>
  </form>
  <div class="homebar"></div>
</div>
<script>
  // 开发壳专用：`?theme=` 强制一套配色（产品页跟随系统 ✓）
  ;(function () {
    var t = new URLSearchParams(location.search).get('theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  })()
</script>
<script type="module">
  import { mountChat } from './ui.js'
  import { ChatPoller } from './poller.js'

  // 开发态（`?state=`）：**走真路径**，不是伪造画面 ✓
  //   empty / loading / error ⇒ 从"取数"这一层制造 ✓；offline ⇒ 从"连接状态"这一层制造 ✓
  const devState = new URLSearchParams(location.search).get('state') || ''

  // 假事件（形状按 37 号探针：{seq, time, type, data} ✓）—— 只为看观感
  const fake = [
    { seq: 1, time: 1, type: 'turn/start', data: { turn: 1 } },
    { seq: 2, time: 2, type: 'userMessage', data: { content: [{ type: 'text', text: '帮我把首页那两个标签的图标换掉' }] } },
    { seq: 3, time: 3, type: 'reasoning', data: { text: '用户要换图标。先看现有实现，再决定要不要新画矢量图。' } },
    { seq: 4, time: 4, type: 'commandExecution', data: { command: 'grep -n "dshm-command-btn" packages/client/src/boot.js' } },
    { seq: 5, time: 5, type: 'agentMessage', data: { text: '图标换成矢量后我渲染出来看了一眼：齿轮第一版环与齿之间有缝，看起来像太阳，已改成齿咬着环。' } },
    { seq: 6, time: 6, type: 'commandExecution', data: { command: [
        'node scripts/check-apk.mjs --verbose \\',
        '  | tee /tmp/apk.log \\',
        '  | tail -40',
        '……（这里省略 26 行，用来验"长输出默认收起 + 说清还藏了几行"）',
        'line 05', 'line 06', 'line 07', 'line 08', 'line 09', 'line 10',
        'line 11', 'line 12', 'line 13', 'line 14', 'line 15', 'line 16',
        'line 17', 'line 18', 'line 19', 'line 20', 'line 21', 'line 22',
        'line 23', 'line 24', 'line 25', 'line 26',
      ].join('\n'), exitCode: 0 } },
    { seq: 7, time: 7, type: 'commandExecution', data: { command: 'adb install -r dist/dsh-mobile.apk', exitCode: 1, output: 'Failure [INSTALL_FAILED_UPDATE_INCOMPATIBLE]' } },
    { seq: 8, time: 8, type: 'approval/asked', data: { requestId: 'ap-1', tool: '执行命令', detail: 'npm test -- --runInBand\n（会动到 packages/ 下的文件）', options: [{ id: 'allow', label: '允许一次' }, { id: 'allow-always', label: '总是允许' }, { id: 'deny', label: '拒绝' }] } },
    { seq: 9, time: 9, type: 'approval/asked', data: { requestId: 'ap-2', tool: '写文件', detail: '写入 /tmp/out.log', 说不清: true } },
    { seq: 10, time: 10, type: 'someUnknownEvent', data: { whatever: 1 } },
  ]

  // ★ 开发壳专有：把页面里的 JS 错误**抓下来画在屏幕上** ✓
  //   （"点了没反应"最难查 ✓ —— 这一行让它在截图里自证 ✓）
  const devErrors = []
  window.addEventListener('error', (e) => devErrors.push('error: ' + e.message))
  window.addEventListener('unhandledrejection', (e) => {
    const reason = e.reason
    devErrors.push('rejection: ' + (reason !== null && typeof reason === 'object' ? reason.message : String(reason)))
  })

  // 假会话列表（形状按 bridges 的归一化输出 ✓）
  let fakeSessions = [
    { id: 's-1', title: '换图标那两个标签', updatedAt: 30 },
    { id: 's-2', title: '原生首页的卡片间距', updatedAt: 90, running: true },
    { id: 's-3', title: '会话页骨架', updatedAt: 10, awaitingApproval: true },
  ]
  let currentId = 's-1'
  // 另一个会话的事件（切过去以后应当**替换**掉 s-1 的内容 ✓，但切换的瞬间不许白屏 ✓）
  const fakeOther = [
    { seq: 1, time: 1, type: 'turn/start', data: { turn: 1 } },
    { seq: 2, time: 2, type: 'userMessage', data: { text: '首页机器卡的间距我想再紧一点' } },
    { seq: 3, time: 3, type: 'agentMessage', data: { text: '好，我把卡片内边距从 14 收到 12，行距不动。' } },
  ]

  let received = 0
  const page = mountChat({
    root: document,
    onSwitch: (id) => {
      // ★ 切到另一个会话：**立刻**把游标清零、让它去取新会话的（旧内容此刻仍在屏上 ✓）
      currentId = id
      received = 0
      page.setSessions(fakeSessions, id)
      void poller.refreshNow()
    },
    send: async (text) => {
      if (devState === 'send-fail') {
        // ★ 立刻失败（不加假延迟）：渲染脚本用的是虚拟时钟，带延迟的失败会被截在"发送中…"那一步 ✗
        throw new Error('隧道断了：socket closed')
      }
      page.appendEvents([{ seq: null, time: Date.now(), type: 'userMessage', data: { text } }])
    },
  })

  const poller = new ChatPoller({
    read: async () => {
      if (devState === 'error') throw new Error('隧道断了：socket closed')
      if (devState === 'loading') return new Promise(() => {})
      if (devState === 'empty') return []
      const source = currentId === 's-2' ? fakeOther : fake
      const slice = source.slice(received, received + 2)
      received += slice.length
      return slice
    },
    ...page.handlers,   // ★ 显式接上（不再靠"偷偷装" ✓）
    intervalMs: 300,
  })

  const refresh = document.querySelector('#refresh')
  if (refresh !== null) refresh.addEventListener('click', () => { void poller.refreshNow() })

  // ★ 开发态 `?send=fail`：填一段草稿 ⇒ **触发真实的提交路径** ⇒ 发送失败
  //   ⇒ 期望：输入框里**字还在**（这是本轮最要紧的一条 ✓），状态行说明白 ✓
  if (devState === 'send-fail') {
    const box = document.querySelector('#input')
    box.value = '这段字打了两分钟，发失败也必须还在——把首页那两颗图标的圆角再收一点，另外底部标签的间距我看还可以再紧 2px。'
    box.dispatchEvent(new Event('input'))
    setTimeout(() => {
      document.querySelector('#composer').dispatchEvent(new Event('submit', { cancelable: true }))
    }, 400)
  }

  page.setSessions(fakeSessions, currentId)
  if (devState === 'offline') page.setConnection('offline')
  if (devState === 'sessions') {
    // 开发态：把会话面板展开（看列表长什么样 ✓）
    const panel = document.querySelector('#sessions')
    panel.hidden = false
    document.querySelector('#title').dispatchEvent(new Event('click'))
    document.querySelector('#title').dispatchEvent(new Event('click'))
  }
  poller.start()

  // 开发壳专有：把游标显示出来（只在这一页有 ✓，产品页没有这行 ✓）
  const dev = document.createElement('div')
  dev.className = 'dev-line'
  dev.textContent = 'dev：' + (devState || 'normal')
  document.querySelector('.app').insertBefore(dev, document.querySelector('#messages').parentElement)
  setInterval(() => {
    // ★ 开发壳把**输入区的真实状态**也画出来 ✓ —— 截图本身就是证据 ✓
    //   （"发送中"卡住 / 草稿丢没丢，一眼就能看出来 ✓）
    const box = document.querySelector('#input')
    const btn = document.querySelector('#composer button')
    dev.textContent = 'dev：' + (devState || 'normal')
      + '｜游标 ' + String(poller.cursor)
      + '｜状态 ' + page.state().kind
      + '｜按钮 ' + (btn === null ? '?' : btn.textContent) + (btn !== null && btn.disabled ? '(禁用)' : '')
      + '｜草稿 ' + String(box === null ? 0 : box.value.length) + ' 字'
      + (devErrors.length > 0 ? '｜✗ ' + devErrors.join(' / ') : '')
  }, 250)
</script>
</body>
</html>
