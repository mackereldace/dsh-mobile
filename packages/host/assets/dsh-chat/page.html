<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151517">
<title>会话</title>
<link rel="stylesheet" href="/mobile/chat/native-tokens.css">
<link rel="stylesheet" href="/mobile/chat/theme.css">
<link rel="stylesheet" href="/mobile/chat/file-panel.css">
<link rel="stylesheet" href="/mobile/chat/native.css">
<link rel="stylesheet" href="/mobile/chat/management.css">
</head>
<body>
<div class="app">
  <!-- 页面拥有自己的 DOM；顶部沿用现有壳的 52px 与 safe-top 契约。 -->
  <header class="chat-top">
    <button id="session-menu" class="icon" type="button" aria-label="会话列表" aria-expanded="false" aria-controls="sessions"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <div>
      <button id="title" class="title" type="button">会话</button>
      <p class="sub" id="sub" hidden></p>
    </div>
    <button id="files" class="icon" type="button" title="文件" aria-label="电脑文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4V3h4l2 2h6v8H2V4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
  </header>
  <div class="tabs" id="tabs" role="tablist" data-conversation-tabs>
    <button type="button" role="tab" id="tab-chat" class="tab is-active" aria-selected="true" aria-controls="messages">对话</button>
    <button type="button" role="tab" id="tab-trace" class="tab" aria-selected="false" aria-controls="trace">轨迹</button>
    <button id="subagent-count" class="subagent-count" type="button" aria-label="子智能体" hidden></button>
  </div>
  <div id="status" role="status"></div>
  <div id="sessions" hidden></div>
  <div id="session-backdrop" hidden></div>
  <div id="session-actions" hidden><button id="refresh" type="button" aria-label="刷新">刷新</button></div>
  <main>
    <div id="welcome" hidden><div class="welcome-title"><img src="/mobile/chat/whale.svg" alt=""><span>探索未至之境</span><span class="preview-badge">预览版</span></div></div>
    <div id="state" hidden></div>
    <div id="messages" data-view="chat"></div>
    <div id="trace" data-view="trace" hidden></div>
  </main>
  <!-- 审批和用户问题是 composer 的独立交互区，永不混进消息窗口。 -->
  <div id="floating-dock">
  <section id="interactions" aria-label="等待你处理" hidden></section>
  <div id="goal-dock" hidden></div>
  <form class="composer" id="composer">
    <div class="composer-card">
      <div id="attachments" class="attachments" hidden></div>
      <textarea id="input" rows="1" aria-label="消息" placeholder="描述你想要构建的内容，/ 调用指令，@ 文件或对话"></textarea>
      <div class="composer-row">
        <div class="composer-tools">
          <button type="button" class="tool-btn" data-tool="command" aria-label="命令行" title="命令行">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.6 L6.6 8 L3.2 11.4 M8.4 11.6 H12.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <button type="button" class="tool-btn" data-tool="attach" aria-label="添加附件" title="附件通道还没接通" aria-disabled="true" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 4.1 5.6 9.1a2.05 2.05 0 0 0 2.9 2.9l5.2-5.2a3.4 3.4 0 0 0-4.8-4.8L3.6 7.3a4.75 4.75 0 0 0 6.7 6.7l4.1-4.1" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <input id="attachment-input" type="file" multiple hidden>
          <button id="permission-select" class="composer-selector" type="button" aria-label="权限模式" hidden></button>
        </div>
        <span class="composer-grow"></span>
        <button id="model-select" class="composer-selector" type="button" aria-label="模型与推理等级" hidden></button>
        <button type="submit" class="send-btn" aria-label="发送" title="发送">
          <svg class="send-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16.6 V4.2 M4.8 9.2 10 4 L15.2 9.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span class="send-label" id="send-label"></span>
        </button>
      </div>
    </div>
    <div class="stats-strip" id="stats-strip" aria-live="polite"></div>
  </form>
  </div>
  <div class="homebar"></div>
</div>
<div id="input-menu" hidden></div>
<script>
  // 隧道、键盘、安全区与 markdown 仍复用 boot；不把依赖 React DOM 的旧外壳装到本页。
  globalThis.__DSH_MOBILE_NO_SHELL__ = true;
  (function () {
    var explicit = document.documentElement.getAttribute('data-theme');
    var dark = explicit === 'dark' || (explicit !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.body.toggleAttribute('data-ds-dark-theme', dark);
  })();
  (function () {
    try {
      var url = new URL(location.href);
      if (url.searchParams.get('mobile') !== '1') {
        url.searchParams.set('mobile', '1');
        history.replaceState(null, '', url.toString());
      }
    } catch (error) { void error; }
  })();
</script>
<script src="/mobile/boot.js" data-dsh-mobile="1"></script>
<script type="module" src="/mobile/chat/app.js"></script>
</body>
</html>
