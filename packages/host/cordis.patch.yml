# DSH Mobile · bundle 自带的插件层
#
# ## 这是什么（官方插件管理那套里的"bundle patch"）
#
# DSH 0.17 起有一套**官方插件管理**（`@deepseek-ai/dsh-plugin-manager` ✓）：
# 一个第三方插件以 **bundle** 的形式发布 —— 就是一个普通 npm 包，在 `package.json` 里用
# `dsh.bundle.patch` 指向**自带的 cordis patch 文件** ✓（见 `package.json` ✓）。
# 用户 `dsh plugin --profile web add <本包>` 装完之后，**这一层就被自动并进配置** ✓，
# 不需要任何人手工编辑 `cordis.patch.yml` ✓。
#
# ## 为什么只有 `insert`、没有 `config`（★ 这是刻意的 ✗）
#
# DSH 的配置是**三层叠加** ✓：
#   ① 每个 bundle 的 patch（本文件 ✓）
#   ② profile 的 `cordis.patch.yml`（用户的层 ✓，**优先级更高** ✓）
#   ③ `$DSH_HOME/cordis.patch.yml`（home 层 ✓）
# 而合成器的规则是：**后续层按 `id` 找到同一行、整块替换它的 `config`** ✓
#（`dsh-app-boot` 的 `applyEntryPatches` ✓）⇒ 所以"**bundle 给行、用户给 config**"
# 是官方支持的组合 ✓，也是**唯一正确的分工** ✓：
#   · `id` / `name` 属于**包**（谁来装都得一样 ✓）⇒ 写在这里 ✓；
#   · `trustedHosts` / `listener` / `phoneBaseUrl` / `extraEndpoints` 属于**这台机器**
#     （每台电脑都不一样 ✓：局域网 IP、端口、有没有 Tailscale ✓）⇒ **绝不能写死在这里** ✗。
#
# ★ 也就是说：**装完这一包，插件行就在了 ✓，但要真正能连手机，还需要那台机器自己的 config** ✓。
#   在**上一版（自研安装器）**里那份 config 是 `scripts/install-host-plugin.mjs` 自动推导并写入的 ✓
#   （`--lan-ip` / `--listener` / `--phone-base-url` ✓，插件本身不做推导 ✗）。
#   ⇒ 走官方这条路装的人，**仍然要拿到那份 config** ✓ —— 这一步的形态见
#     `24-0.17官方插件管理-调研与接入方案.md` §5.3 与 §9 ✓（**尚未定稿** ✗：要在临时 profile 上
#     真装一次、看它到底报什么错再定 ✓，别照文档猜 ✗）。
#
# ## 只有一条行了（★ 桥搬走了 ✗ —— 2026-09-29 实测逼出来的 ✓）
#
# 原先这里还有第二条 `mobile-preview-bridge` ✓。现在它搬去 `@dsh-mobile/bridge`
# **自己的** `cordis.patch.yml` ✓ —— 原因见那份文件的开头（`blockExoticSubdeps` ✗：
# 桥不能再当 host 的子依赖 ✓，而能装的顶层东西必须自己是 bundle ✓）。
# ⇒ 官方那条路要**装两次**（host 一次、bridge 一次 ✓）；自研安装器不受影响 ✓。
- insert:
    - id: mobile-host
      name: '@dsh-mobile/host'
